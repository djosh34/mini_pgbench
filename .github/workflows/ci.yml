name: test-build-scan
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go test -race ./...
      - run: tests/integration.sh
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build -trimpath -o bin/mini_pgbench .
      - uses: docker/setup-buildx-action@v3
      - name: Build platform image
        run: docker buildx build --platform linux/${{ matrix.arch }} --output type=docker,dest=image.tar .
      - name: Scan every HIGH and CRITICAL finding (including unfixed)
        run: >-
          docker run --rm -v "$PWD:/work:ro"
          aquasec/trivy:0.76.0 image --input /work/image.tar
          --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --ignorefile /dev/null
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/djosh34/mini_pgbench:latest
            ghcr.io/djosh34/mini_pgbench:${{ github.sha }}
