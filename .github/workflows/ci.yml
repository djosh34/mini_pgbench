name: test-build-scan
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - run: tests/integration.sh
      - uses: docker/setup-buildx-action@v4
      - name: Build the image
        run: docker buildx build --platform linux/${{ matrix.arch }} --output type=docker,dest=image.tar .
      - name: Scan the image for HIGH and CRITICAL vulnerabilities
        run: >-
          docker run --rm -v "$PWD:/work:ro"
          aquasec/trivy:0.76.1 image --input /work/image.tar
          --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --ignorefile /dev/null
  gui:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mini_pgbench_gui
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.14.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: mini_pgbench_gui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - name: Check that the committed dist/ matches the build
        run: test -z "$(git status --porcelain --untracked-files=all -- dist)"
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the amd64 and arm64 image archive
        run: docker buildx build --platform linux/amd64,linux/arm64 --provenance=false --output type=oci,dest=image.tar .
      - name: Scan both platforms before publishing
        run: |
          for arch in amd64 arm64; do
            skopeo copy --override-os linux --override-arch "$arch" \
              oci-archive:image.tar docker-archive:scan-$arch.tar
            docker run --rm -v "$PWD:/work:ro" aquasec/trivy:0.76.1 image \
              --input /work/scan-$arch.tar --scanners vuln \
              --severity HIGH,CRITICAL --exit-code 1 --ignorefile /dev/null
          done
      - name: Publish the scanned archive as the commit sha and latest
        run: |
          for tag in "${{ github.sha }}" latest; do
            skopeo copy --all --authfile "$HOME/.docker/config.json" \
              oci-archive:image.tar docker://ghcr.io/djosh34/mini_pgbench:$tag
          done
